name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    # Lint, the browser-bundle transpile and the package build share one runner:
    # each takes seconds, so separate jobs would spend longer starting than running.
    name: Lint, JSX, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install tooling
        run: python -m pip install --upgrade pip ruff pytest build twine
      - name: ruff check
        run: ruff check .
      # A JSX syntax error in a concatenated UI bundle renders the page black
      # while the route still returns 200. The test skips when Babel is missing,
      # so C3_REQUIRE_JSX_TOOLCHAIN=1 turns a missing toolchain into a failure.
      # --prefix . keeps node_modules in the repo root, where the test's node
      # subprocess looks (the repo has no package.json).
      - name: Install Babel
        run: npm install --no-save --prefix . @babel/standalone
      - name: Transpile both UI bundles
        env:
          C3_REQUIRE_JSX_TOOLCHAIN: "1"
        run: pytest -q tests/test_ui_jsx_syntax.py
      - name: Build sdist + wheel
        run: |
          python -m build --sdist --wheel --outdir dist
          python -m twine check dist/*

  test:
    name: Test (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Newest Python on every OS, plus the oldest supported one on Linux.
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]
        include:
          - { os: ubuntu-latest, python-version: "3.10" }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package + dev extras
        # Editable: several tests patch `services.*` paths that only resolve
        # when the source dir is the installed package.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run pytest
        env:
          SENTRY_DSN: ""
          C3_TELEMETRY_OPT_IN: "0"
        run: pytest -q
