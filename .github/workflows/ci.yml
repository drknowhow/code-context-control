name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ruff
        run: python -m pip install --upgrade pip ruff
      - name: ruff check
        run: ruff check .

  jsx:
    # The browser-transpiled UI bundles, parsed by the real Babel.
    # A JSX syntax error anywhere in a concatenated bundle renders the page
    # black while the route still returns 200, so nothing Python-side notices;
    # 2.92.0-2.92.3 shipped exactly that. The test that catches it SKIPS when
    # @babel/standalone is missing, and a skip reads like a pass in the summary
    # line — hence C3_REQUIRE_JSX_TOOLCHAIN=1, which turns a missing toolchain
    # into a failure instead. One job: the bundles are OS-independent, so
    # paying for this on all nine test cells would buy nothing.
    name: JSX bundles transpile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Babel
        # Local (not -g) so `require.resolve` finds it from the repo root,
        # which is the cwd the test probes from. No NODE_PATH needed.
        run: npm install --no-save @babel/standalone
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Transpile both bundles
        env:
          C3_REQUIRE_JSX_TOOLCHAIN: "1"
        run: pytest -q tests/test_ui_jsx_syntax.py

  test:
    name: Test (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package + dev extras
        # Editable install so tests run against the source tree (matches local dev).
        # Several tests patch `services.*` import paths that only work when the
        # source dir IS the installed package. A separate wheel-install job below
        # validates the production install path.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run pytest
        env:
          # Smoke tests must not initialize real telemetry
          SENTRY_DSN: ""
          C3_TELEMETRY_OPT_IN: "0"
        run: pytest -q

  build:
    name: Build distribution
    needs: [lint, jsx, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine
      - name: Build sdist + wheel
        run: python -m build --sdist --wheel --outdir dist
      - name: twine check
        run: python -m twine check dist/*
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7
